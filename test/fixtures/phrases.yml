# the same shared phrase rows as production. tenant_id NULL = shared.
# render_status: rendered because the WAVs exist on disk.

formal_lei:
  tenant_id:
  slug: formal_lei
  label: Formal address (Lei)
  kind: user
  text_it: "Buongiorno. In questo momento sono impegnato. La prego di lasciare un messaggio dicendo di cosa ha bisogno: se necessario la richiamerò."
  text_en: "Good day. I'm currently busy. Please leave a message stating what you need; I will call you back if necessary."
  time_of_day: any
  render_status: rendered
  last_rendered_at: <%= Time.current %>

