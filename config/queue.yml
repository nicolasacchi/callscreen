default: &default
  dispatchers:
    - polling_interval: 30
      batch_size: 500
  workers:
    # HDD RAID5 host: 1 thread + 30s poll. Worst-case pickup +30s is fine vs
    # multi-second Whisper+LLM screening; avoids SQLite claim write storms.
    - queues: "default"
      threads: 1
      processes: 1
      polling_interval: 30
    - queues: "rendering"
      threads: 1
      processes: 1
      polling_interval: 30

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
