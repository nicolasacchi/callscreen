# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  cleanup_recordings:
    class: CleanupRecordingsJob
    queue: rendering
    schedule: "0 3 * * * Europe/Rome"

  # queue: is mandatory here — a command-style task with no queue enqueues its
  # SolidQueue::RecurringJob wrapper into "solid_queue_recurring", which no
  # worker in config/queue.yml consumes (bit us in prod: 1.5k jobs piled up
  # unprocessed for two months).
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    queue: default
    schedule: every hour at minute 12

  # Re-enqueue phrases wedged in render_status "rendering" (worker SIGKILLed
  # mid-render leaves no Ruby rescue to flip the status back).
  requeue_stuck_renders:
    class: RequeueStuckRendersJob
    queue: rendering
    schedule: every 15 minutes

  # Hang up + finalize calls stranded mid-flow by a dropped Telnyx command,
  # so a caller can't be left in dead air indefinitely.
  sweep_stuck_calls:
    class: SweepStuckCallsJob
    queue: default
    schedule: every 5 minutes

  # Re-classify calls that captured a recording but lost their ScreeningJob
  # enqueue (worker crash between the atomic claim and perform_later), so a real
  # caller isn't left unclassified + unnotified.
  reconcile_stuck_screenings:
    class: ReconcileStuckScreeningsJob
    queue: default
    schedule: every 5 minutes

  # Hourly aggregate health digest to the operator ntfy when failures
  # accumulate (dead set, failed calls/renders, stuck calls).
  operator_health_watchdog:
    class: OperatorHealthWatchdogJob
    queue: default
    schedule: every hour at minute 7
